<polygon points="205.00,446.00 197.05,457.44 191.44,449.17" fill="#d63832"/>
<line x1="270" y1="390" x2="553" y2="316" stroke="#d63832" stroke-width="3"/>
<polygon points="553.00,316.00 541.69,324.13 539.16,314.45" fill="#d63832"/>
<line x1="444" y1="520" x2="553" y2="316" stroke="#d63832" stroke-width="3"/>
<polygon points="553.00,316.00 551.28,329.82 542.46,325.11" fill="#d63832"/>
<line x1="618" y1="260" x2="1249" y2="186" stroke="#d63832" stroke-width="3"/>
<polygon points="1249.00,186.00 1236.67,192.48 1235.51,182.55" fill="#d63832"/>
<line x1="792" y1="520" x2="901" y2="446" stroke="#d63832" stroke-width="3"/>
<polygon points="901.00,446.00 893.05,457.44 887.44,449.17" fill="#d63832"/>
