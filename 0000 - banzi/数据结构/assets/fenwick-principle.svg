<polygon points="1249.00,186.00 1249.72,199.91 1240.21,196.81" fill="#d63832"/>
<rect x="31" y="520" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="96" y="557" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[1]</text>
<text x="96" y="584" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[1, 1]</text>
<rect x="31" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="96" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[1]</text>
<rect x="205" y="390" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="270" y="427" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[2]</text>
<text x="270" y="454" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[1, 2]</text>
<rect x="205" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="270" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[2]</text>
<rect x="379" y="520" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="444" y="557" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[3]</text>
<text x="444" y="584" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[3, 3]</text>
<rect x="379" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="444" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[3]</text>
<rect x="553" y="260" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="618" y="297" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[4]</text>
<text x="618" y="324" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[1, 4]</text>
<rect x="553" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="618" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[4]</text>
<rect x="727" y="520" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="792" y="557" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[5]</text>
<text x="792" y="584" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[5, 5]</text>
<rect x="727" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="792" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[5]</text>
<rect x="901" y="390" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="966" y="427" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[6]</text>
<text x="966" y="454" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[5, 6]</text>
<rect x="901" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="966" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[6]</text>
<rect x="1075" y="520" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="1140" y="557" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[7]</text>
<text x="1140" y="584" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[7, 7]</text>
<rect x="1075" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="1140" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[7]</text>
<rect x="1249" y="130" width="130" height="80" rx="8" fill="#fff5f3" stroke="#d63832" stroke-width="2.5"/>
<text x="1314" y="167" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="27" font-weight="bold" fill="#d63832" text-anchor="middle">a[8]</text>
<text x="1314" y="194" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#a9443d" text-anchor="middle">[1, 8]</text>
<rect x="1249" y="670" width="130" height="66" rx="6" fill="#f6f7f9" stroke="#243043" stroke-width="2"/>
<text x="1314" y="713" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="25" font-weight="normal" fill="#243043" text-anchor="middle">b[8]</text>
<text x="64" y="784" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#667085" text-anchor="start">下方：原始数组 b[i]    上方：板子中的 a[i]，框内标注其维护区间</text>
<rect x="64" y="823" width="640" height="171" rx="12" fill="#fff7f5" stroke="#f0d3ce" stroke-width="1"/>
<text x="86" y="863" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="23" font-weight="normal" fill="#d63832" text-anchor="start">单点增加：add(3, v)</text>
<text x="86" y="913" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="32" font-weight="bold" fill="#d63832" text-anchor="start">3 → 4 → 8</text>
<text x="86" y="950" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#243043" text-anchor="start">依次给 a[3]、a[4]、a[8] 加上 v</text>
<text x="86" y="979" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="17" font-weight="normal" fill="#667085" text-anchor="start">每次 i += lowbit(i)，直到 i &gt; n</text>
<rect x="742" y="823" width="634" height="171" rx="12" fill="#f5f8ff" stroke="#d3def2" stroke-width="1"/>
<text x="764" y="863" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="23" font-weight="normal" fill="#245ab5" text-anchor="start">前缀和：sum(7)</text>
<text x="764" y="913" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="32" font-weight="bold" fill="#245ab5" text-anchor="start">7 → 6 → 4 → 0</text>
<text x="764" y="950" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#243043" text-anchor="start">累加 a[7] + a[6] + a[4]</text>
<text x="764" y="979" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="17" font-weight="normal" fill="#667085" text-anchor="start">[7, 7] + [5, 6] + [1, 4] 恰好覆盖 [1, 7]</text>
<text x="64" y="1031" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="17" font-weight="normal" fill="#667085" text-anchor="start">sum 查询每次 i -= lowbit(i)；各段互不重叠，合起来就是所求前缀。</text>
</svg>
