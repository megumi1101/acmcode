<line x1="792" y1="600" x2="792" y2="670" stroke="#bbc3ce" stroke-width="2" stroke-dasharray="5 7"/>
<line x1="966" y1="470" x2="966" y2="670" stroke="#bbc3ce" stroke-width="2" stroke-dasharray="5 7"/>
<line x1="1140" y1="600" x2="1140" y2="670" stroke="#bbc3ce" stroke-width="2" stroke-dasharray="5 7"/>
<line x1="1314" y1="210" x2="1314" y2="670" stroke="#bbc3ce" stroke-width="2" stroke-dasharray="5 7"/>
