<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1056" viewBox="0 0 1440 1056" role="img" aria-labelledby="title description">
<title id="title">树状数组原理图：节点区间、更新路径与前缀和查询</title>
<desc id="description">原始数组 b 的下标从 1 到 8。树状数组 a[i] 保存区间 [i-lowbit(i)+1,i] 的和。更新父节点是 i+lowbit(i)：1 到 2，2 到 4，3 到 4，4 到 8，5 到 6，6 到 8，7 到 8。add(3,v) 更新 3、4、8；sum(7) 累加 7、6、4。</desc>
<rect width="1440" height="1056" fill="white"/>
<text x="64" y="65" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="36" font-weight="bold" fill="#243043" text-anchor="start">树状数组原理图</text>
<text x="64" y="105" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="19" font-weight="normal" fill="#667085" text-anchor="start">下标从 1 开始  ·  n = 8  ·  lowbit(i) = i &amp; (-i)</text>
<rect x="64" y="150" width="470" height="122" rx="12" fill="#f7f8fa" stroke="#e5e8ee" stroke-width="1"/>
<text x="84" y="184" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="21" font-weight="normal" fill="#243043" text-anchor="start">每个节点保存一段连续区间的和</text>
<text x="84" y="225" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="24" font-weight="normal" fill="#243043" text-anchor="start">a[i] = sum(b[L..i])</text>
<text x="84" y="255" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="18" font-weight="normal" fill="#667085" text-anchor="start">L = i - lowbit(i) + 1</text>
<line x1="64" y1="307" x2="101" y2="307" stroke="#d63832" stroke-width="3"/>
<polygon points="101.00,307.00 88.00,312.00 88.00,302.00" fill="#d63832"/>
<text x="115" y="314" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="18" font-weight="normal" fill="#d63832" text-anchor="start">更新连线：i → i + lowbit(i)</text>
<line x1="64" y1="339" x2="101" y2="339" stroke="#b9c1cc" stroke-width="2" stroke-dasharray="5 7"/>
<text x="115" y="346" font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="18" font-weight="normal" fill="#667085" text-anchor="start">对应原始数组中的位置</text>
<line x1="96" y1="600" x2="96" y2="670" stroke="#bbc3ce" stroke-width="2" stroke-dasharray="5 7"/>
<line x1="270" y1="470" x2="270" y2="670" stroke="#bbc3ce" stroke-width="2" stroke-dasharray="5 7"/>
